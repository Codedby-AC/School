<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>AI School: Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.css">
    <link rel="stylesheet" href="css/ai-school-theme.css">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <a href="index.html">
                <img src="img/logo-ai.png" alt="AI School Logo">
            </a>
        </div>
        <h2 class="auth-title">Recover Access</h2>
        <p class="auth-subtitle">Enter your email address to receive a password reset link.</p>

        <form class="auth-form" action="reset-password.html">
            <div class="form-group">
                <label>Email Address</label>
                <i class="fa fa-envelope input-icon"></i>
                <input type="email" class="form-control" placeholder="john@aischool.dev" required>
            </div>

            <button type="submit" class="auth-btn mt-2">Send Reset Link</button>
        </form>

        <div class="auth-links">
            Remembered your password? <a href="login.html">Back to Login</a>
        </div>
    </div>
</body>

</html>
