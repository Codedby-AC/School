<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>AI School: Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.css">
    <link rel="stylesheet" href="css/ai-school-theme.css">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <a href="index.html">
                <img src="img/logo-ai.png" alt="AI School Logo">
            </a>
        </div>
        <h2 class="auth-title">Reset Password</h2>
        <p class="auth-subtitle">Create a new, strong password for your account.</p>

        <form class="auth-form" action="login.html">
            <div class="form-group">
                <label>New Password</label>
                <i class="fa fa-lock input-icon"></i>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <i class="fa fa-check-circle input-icon"></i>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="auth-btn mt-3">Update Password</button>
        </form>

        <div class="auth-links">
            <a href="login.html">Back to Login</a>
        </div>
    </div>
</body>

</html>
