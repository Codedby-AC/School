<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>AI School: Login</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- Bootstrap v5.3.0 CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Font-Awesome-5 CSS -->
    <link rel="stylesheet" href="css/font-awesome.css">
    <!-- Custom Theme CSS -->
    <link rel="stylesheet" href="css/ai-school-theme.css">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <a href="index.html">
                <img src="img/logo-ai.png" alt="AI School Logo">
            </a>
        </div>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Log in to access your neural network lab.</p>

        <form class="auth-form" action="index.html">
            <div class="form-group">
                <label>Email Address</label>
                <i class="fa fa-envelope input-icon"></i>
                <input type="email" class="form-control" placeholder="john@aischool.dev" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <i class="fa fa-lock input-icon"></i>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="forgot-pwd-link">
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-btn">Initialize Session <i class="fa fa-arrow-right ms-2"></i></button>
        </form>

        <div class="auth-links">
            Don't have an account? <a href="sign-up.html">Sign Up Now</a>
        </div>
    </div>
</body>

</html>
